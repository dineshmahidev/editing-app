# Vixel Edit - Codemagic configuration
# Debug build ONLY. Runs Expo prebuild then a plain `assembleDebug` APK.
# No code signing, no Play/App Store publishing - purely an installable debug app.

workflows:
  vixel-debug-android:
    name: Vixel Edit - Android Debug APK
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      node: v22.13.1
      vars:
        PACKAGE_NAME: "com.vixeledit.vixiledit"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Generate Android project (expo prebuild)
        script: |
          npx expo prebuild --platform android --no-install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - 157237445+DineshWebDev2003@users.noreply.github.com
        notify:
          success: true
          failure: true